services:
  flask-server:
    build: .
    ports:
      - "8081:5000"
    volumes:
      - ./readings.db:/app/readings.db
    networks:
      - sensor-net

  hadoop-worker:
    build:
      context: ./hadoop
      dockerfile: Dockerfile
    container_name: hadoop-analysis
    depends_on:
      - flask-server
    environment:
      - SERVER_URL=http://flask-server:5000/hadoop
      - RESULTS_URL=http://flask-server:5000/hadoop_results
    networks:
      - sensor-net

  air-quality-sensor:
    build:
      context: .
      dockerfile: Dockerfile.sensor
    volumes:
      - ./sensors/air_quality:/app
    command: python air_quality.py
    networks:
      - sensor-net

  co2-sensor:
    build:
      context: .
      dockerfile: Dockerfile.sensor
    volumes:
      - ./sensors/co2:/app
    command: python co2.py
    networks:
      - sensor-net

  temperature-sensor:
    build:
      context: .
      dockerfile: Dockerfile.sensor
    volumes:
      - ./sensors/temperature:/app
    command: python temperature.py
    networks:
      - sensor-net

networks:
  sensor-net:
    driver: bridge